# Defaults for every JVM started from this image (master, worker, drivers).
# Mounted read-only over /opt/spark/conf/spark-defaults.conf

# Where clients go if they are started inside a container of this stack.
spark.master                     spark://spark-master:7077

# Event log shared by master, worker and the optional history server.
spark.eventLog.enabled           true
spark.eventLog.dir               file:///tmp/spark-events
spark.eventLog.compress          true
spark.history.fs.logDirectory    file:///tmp/spark-events

# Small cluster defaults: one worker with 2 cores / 2g, so keep executors modest
# and stop Spark from carving 200 shuffle partitions out of tiny data.
spark.executor.memory            1g
spark.executor.cores             2
spark.driver.memory              1g
spark.sql.shuffle.partitions     8
spark.sql.adaptive.enabled       true
spark.default.parallelism        4

# The image runs as uid 185 with HOME=/nonexistent, so tell Spark where to
# download --packages / --jars artifacts (this path is a shared volume, so the
# connector is fetched once and reused by master, worker and drivers).
spark.jars.ivy                  /tmp/spark-ivy

# UIs
spark.ui.showConsoleProgress     false
spark.ui.retainedJobs            50
spark.ui.retainedStages          50

# Standalone-mode worker restart behaviour, handy while experimenting.
spark.deploy.spreadOut           true
spark.worker.cleanup.enabled     true
spark.worker.cleanup.interval    300
spark.worker.cleanup.appDataTtl  86400

# Kafka connector tuning: 4.1.x ships the Kafka client; keep batch sizes small
# so an experiment does not read a whole topic into memory at once.
spark.sql.streaming.kafka.maxRatePerPartition  1000
