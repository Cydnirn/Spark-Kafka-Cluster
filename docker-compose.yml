# Spark + Kafka experiment cluster
# ---------------------------------------------------------------------------
#   spark-master  : standalone Spark master (RPC 7077, UI 8080)
#   spark-worker  : one standalone Spark worker (UI 8081)
#   kafka         : single-node KRaft broker/controller (host listener 29092)
#   history       : Spark History Server      (profile: tools, UI 18080)
#   kafka-ui      : Kafka UI (kafbat)         (profile: tools, UI 8090)
#
# Profiles (see README, "Start"):
#   master  : the whole stack — init-dirs, spark-master, spark-worker, kafka,
#             jupyter, and the tools (history server, Kafka UI)
#   worker  : init-dirs + spark-worker ONLY — for a second machine that should
#             just add compute to a master running elsewhere
#   tools   : history server + Kafka UI only
# SPARK_MASTER_IP (.env) is the address the worker dials, so the same file works
# on every node: leave it as spark-master on a single host, set it to the
# master's LAN IP for a multi-host cluster.
#
# Quick start (single host):  docker compose --profile master up -d
# Other node:                 docker compose --profile worker up -d
# Podman:                     podman compose --profile master up -d
# ---------------------------------------------------------------------------
name: spark-kafka

x-spark-common: &spark-common
  image: ${SPARK_IMAGE:-apache/spark:4.1.3-scala2.13-java17-python3-ubuntu}
  restart: unless-stopped
  environment:
    SPARK_NO_DAEMONIZE: "true"
    # Visible inside the containers so a manual spark-submit (or a shell) can
    # use --master spark://$SPARK_MASTER_IP:7077 without hardcoding a host.
    SPARK_MASTER_IP: ${SPARK_MASTER_IP:-spark-master}
  volumes:
    # :z asks SELinux hosts (Fedora/RHEL) to relabel the mount; harmless elsewhere
    - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro,z
    - spark-events:/tmp/spark-events
    - spark-ivy:/tmp/spark-ivy
    - ./examples:/opt/examples:ro,z
  depends_on:
    init-dirs:
      condition: service_completed_successfully
  networks: [bigdata]

services:
  # Fixes ownership of the shared volumes so the non-root Spark/Kafka users can
  # write to them, no matter which UID the images use.
  init-dirs:
    image: ${BUSYBOX_IMAGE:-busybox:1.37}
    container_name: skc-init
    # Both profiles need it: it prepares the volumes each profile mounts. A
    # worker-only node creates the Kafka/Jupyter volumes too, empty and unused.
    profiles: [master, worker]
    command:
      - sh
      - -c
      - >-
        mkdir -p /vol/spark-events /vol/spark-ivy /vol/kafka /vol/jupyter &&
        chown -R 185:185 /vol/spark-events /vol/spark-ivy /vol/jupyter &&
        chown -R 1000:1000 /vol/kafka
    volumes:
      - spark-events:/vol/spark-events
      - spark-ivy:/vol/spark-ivy
      - kafka-data:/vol/kafka
      - jupyter-work:/vol/jupyter
    restart: "no"

  # --------------------------------------------------------------- Spark ----
  spark-master:
    <<: *spark-common
    profiles: [master]
    hostname: spark-master
    container_name: skc-spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      # Deliberately the service name, not SPARK_MASTER_IP: Spark binds the
      # --host value as well as advertising it, and the LAN IP belongs to the
      # host machine, not to this container — pointing --host at it fails with
      # "Cannot assign requested address" (verified). Workers do not care: they
      # register over the connection they open to SPARK_MASTER_IP themselves.
      - --host
      - spark-master
      # container-internal ports stay fixed (the worker and the healthcheck rely
      # on 7077/8080); only the host-side mapping below is configurable
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "${SPARK_MASTER_HOST_PORT:-7077}:7077"
      - "${SPARK_MASTER_UI_HOST_PORT:-8080}:8080"
      # Driver rendezvous ports, published for LAN workers: executors on another
      # machine connect back to the driver here (README: "Run a cluster across a
      # LAN"). Idle unless a driver pins them with spark.driver.port /
      # spark.blockManager.port.
      - "${SPARK_DRIVER_PORT:-7078}:7078"
      - "${SPARK_BLOCKMANAGER_PORT:-7079}:7079"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-worker:
    <<: *spark-common
    # In both profiles: the master node runs a local worker too, and a second
    # machine runs this service alone (--profile worker).
    profiles: [master, worker]
    hostname: spark-worker
    container_name: skc-spark-worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      # The master address is a .env knob, not the service name, so the same
      # file joins a master on another host.
      - spark://${SPARK_MASTER_IP:-spark-master}:7077
      - --webui-port
      - "8081"
      - --cores
      - "${SPARK_WORKER_CORES:-2}"
      - --memory
      - "${SPARK_WORKER_MEMORY:-2g}"
    ports:
      - "${SPARK_WORKER_UI_HOST_PORT:-8081}:8081"
    depends_on:
      init-dirs:
        condition: service_completed_successfully
      # No dependency on spark-master on purpose: on a worker-only node that
      # service is not in the profile, and Compose would still start it there.
      # Spark workers retry registration, so ordering does not matter.
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}

  # --------------------------------------------------------------- Kafka ----
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.2}
    profiles: [master]
    hostname: kafka
    container_name: skc-kafka
    restart: unless-stopped
    ports:
      # host clients (CLI, IDE, python) -> localhost:29092
      - "${KAFKA_HOST_PORT:-29092}:29092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # CONTROLLER = raft quorum, PLAINTEXT = in-cluster (spark), PLAINTEXT_HOST = host
      KAFKA_LISTENERS: CONTROLLER://kafka:29093,PLAINTEXT://0.0.0.0:19092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # single broker => replication factor 1 everywhere
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      init-dirs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [bigdata]

  # ------------------------------------------------------------- Jupyter ----
  # Built from the same Spark image as the cluster (see jupyter/Dockerfile) so
  # driver, master and executors are the same version. Driver runs in this
  # container, executors run on spark-worker.
  jupyter:
    build:
      context: ./jupyter
      args:
        SPARK_IMAGE: ${SPARK_IMAGE:-apache/spark:4.1.3-scala2.13-java17-python3-ubuntu}
    image: ${JUPYTER_IMAGE:-spark-kafka-jupyter:4.1.3}
    profiles: [master]
    hostname: jupyter
    container_name: skc-jupyter
    restart: unless-stopped
    ports:
      - "${JUPYTER_HOST_PORT:-8888}:8888"
    environment:
      # --packages here (rather than in the notebook code) is what makes the Kafka
      # connector available to driver *and* executors; jars land in spark.jars.ivy
      # (/tmp/spark-ivy), so the first run downloads and later runs reuse them.
      PYSPARK_SUBMIT_ARGS: >-
        --packages org.apache.spark:spark-sql-kafka-0-10_2.13:${SPARK_CONNECTOR_VERSION:-4.1.3}
        pyspark-shell
      SPARK_CONF_DIR: /opt/spark/conf
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro,z
      - ./examples:/opt/examples:ro,z
      - jupyter-work:/opt/notebooks
      - spark-events:/tmp/spark-events
      - spark-ivy:/tmp/spark-ivy
    depends_on:
      init-dirs:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [bigdata]

  # ---------------------------------------------------- optional tooling ----
  spark-history:
    <<: *spark-common
    # Also part of master: on the master node it is the node that owns the
    # event-log volume. A worker-only node has no history server.
    profiles: [tools, master]
    hostname: spark-history
    container_name: skc-spark-history
    command: ["/opt/spark/sbin/start-history-server.sh"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=file:///tmp/spark-events
        -Dspark.history.ui.port=18080
    ports:
      - "${SPARK_HISTORY_UI_HOST_PORT:-18080}:18080"

  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-kafbat/kafka-ui:v1.5.0}
    profiles: [tools, master]
    container_name: skc-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [bigdata]

networks:
  bigdata:
    name: spark-kafka-net

volumes:
  kafka-data:
  spark-events:
  spark-ivy:
  jupyter-work:
